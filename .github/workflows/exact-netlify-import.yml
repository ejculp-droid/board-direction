name: Exact Netlify production source import
on:
  push:
    paths:
      - ".github/workflows/exact-netlify-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch published production files without modifying contents
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://6af81b6250b6238050e00fef--statuesque-queijadas-7ed91b.netlify.app"
          rm -rf public
          mkdir -p public
          files=(
            "index.html"
            "about/index.html"
            "services/index.html"
            "pages/privacy/index.html"
            "pages/terms/index.html"
            "pages/cookies/index.html"
            "assets/css/style.css"
            "assets/js/main.js"
            "assets/images/boardroom.webp"
            "assets/images/board-direction-mark-24776e.svg"
            "favicon.svg"
          )
          for file in "${files[@]}"; do
            mkdir -p "public/$(dirname "$file")"
            curl --fail --location --retry 3 --silent --show-error --output "public/$file" "$BASE/$file"
            test -s "public/$file"
            echo "Copied live deploy: $file ($(wc -c < "public/$file") bytes)"
          done
          grep -iq "Board Direction" public/index.html
          test "$(find public -type f | wc -l)" -eq 11
          echo "Verified: exactly 11 files from current Netlify production deployment."

      - name: Commit exact published files to the existing GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public
          if ! git diff --cached --quiet; then
            git commit -m "Sync exact files from current Board Direction Netlify production deployment"
            git push origin HEAD:main
          else
            echo "Current GitHub site files exactly match deployed files."
          fi
