name: Import published Board Direction site
on:
  push:
    paths:
      - ".github/workflows/recover-netlify-live.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download currently published Netlify deployment
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="https://6af81b6250b6238050e00fef--statuesque-queijadas-7ed91b.netlify.app/"
          HOST="6af81b6250b6238050e00fef--statuesque-queijadas-7ed91b.netlify.app"
          mkdir -p public
          wget --recursive --level=5 --page-requisites --convert-links --adjust-extension --no-host-directories --no-parent --execute robots=off --quota=40m --tries=3 --timeout=20 --no-verbose --directory-prefix=public --domains="$HOST" "$SOURCE"
          test -s public/index.html
          grep -Eiq 'Board[[:space:]]+Direction' public/index.html
          echo "Recovered files:"
          find public -type f -print | sort

      - name: Configure static Netlify publishing
        shell: bash
        run: |
          cat > netlify.toml <<'TOML'
          "$schema" = "https://open-api.netlify.com/netlify.schema.json"

          [build]
            publish = "public"
          TOML
          cat > README.md <<'MARKDOWN'
          # Board Direction Website

          This repository contains the published static site for https://board-direction.com/.

          The site files are in the `public/` directory. Once the existing Netlify project is linked to this repository, each commit to `main` will publish from that directory automatically. No build command is required.

          ## Migration snapshot

          Initial files were recovered from the immutable Netlify production deployment `6af81b6250b6238050e00fef`, published on November 14, 2026. The currently published Netlify site has not been modified by this recovery.

          ## Netlify

          Connect the **existing** Board Direction Netlify project to `ejculp-droid/board-direction`. Use production branch `main` and publish directory `public` (also configured by `netlify.toml`).

          This is a snapshot of the deployed files, not necessarily any predeployment project sources.
          MARKDOWN

      - name: Commit recovered site to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public netlify.toml README.md
          if ! git diff --cached --quiet; then
            git commit -m "Import current Board Direction Netlify deployment"
            git push origin HEAD:main
          fi
