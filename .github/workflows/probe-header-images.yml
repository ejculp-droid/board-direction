name: Probe temporary image transfer
on:
  push:
    branches:
      - preview/asset-transfer-check
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test resolutions
        shell: bash
        run: |
          set -u
          mkdir -p transfer
          echo TEST transfer/services-420-same-sig.png
          if curl -fsSL --max-time 20 "https://media.canva.com/v2/image-resize/format:PNG/height:420/quality:100/uri:ifs%3A%2F%2FM%2F8cb12819-3172-4646-9107-e7255852254e/watermark:F/width:420?csig=AAAAAAAAAAAAAAAAAAAAAGX34HE16ht0ipUk2NMHHs83H4yu-0kCS8mAfuHWlCT0&exp=1794665951&osig=AAAAAAAAAAAAAAAAAAAAAO3ZPvBhYruOjjuT3kcYl4564uJeBEsvEdsP0oCVDMzM&signer=media-rpc&token=AAIAAU0AJDhjYjEyODE5LTMxNzItNDY0Ni05MTA3LWU3MjU1ODUyMjU0ZQAAAAABodptLxjKT1q6kqsv4IseHvr2STZCJqxXOWPXAqXEGWfzqbooUw&x-canva-quality=thumbnail" -o transfer/services-420-same-sig.png; then file transfer/services-420-same-sig.png; else echo FETCH_FAILED transfer/services-420-same-sig.png; fi
          echo TEST transfer/services-420-no-sig.png
          if curl -fsSL --max-time 20 "https://media.canva.com/v2/image-resize/format:PNG/height:420/quality:100/uri:ifs%3A%2F%2FM%2F8cb12819-3172-4646-9107-e7255852254e/watermark:F/width:420?exp=1794665951&signer=media-rpc&token=AAIAAU0AJDhjYjEyODE5LTMxNzItNDY0Ni05MTA3LWU3MjU1ODUyMjU0ZQAAAAABodptLxjKT1q6kqsv4IseHvr2STZCJqxXOWPXAqXEGWfzqbooUw&x-canva-quality=thumbnail" -o transfer/services-420-no-sig.png; then file transfer/services-420-no-sig.png; else echo FETCH_FAILED transfer/services-420-no-sig.png; fi
