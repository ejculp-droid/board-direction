name: Probe temporary image transfer
on:
  push:
    branches:
      - preview/asset-transfer-check
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check image CDN access
        shell: bash
        run: |
          set -u
          mkdir -p transfer
          echo "Testing service original"
          if curl -fLsS --retry 1 --max-time 30 "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F8cb12819-3172-4646-9107-e7255852254e/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGX34HE16ht0ipUk2NMHHs83H4yu-0kCS8mAfuHWlCT0&exp=1794665951&osig=AAAAAAAAAAAAAAAAAAAAAO3ZPvBhYruOjjuT3kcYl4564uJeBEsvEdsP0oCVDMzM&signer=media-rpc&token=AAIAAU0AJDhjYjEyODE5LTMxNzItNDY0Ni05MTA3LWU3MjU1ODUyMjU0ZQAAAAABodptLxjKT1q6kqsv4IseHvr2STZCJqxXOWPXAqXEGWfzqbooUw&x-canva-quality=thumbnail" -o transfer/service-original.png; then file transfer/service-original.png; du -h transfer/service-original.png; else echo "FAILED service original"; fi
          echo "Testing service resized1254"
          if curl -fLsS --retry 1 --max-time 30 "https://media.canva.com/v2/image-resize/format:PNG/height:1254/quality:100/uri:ifs%3A%2F%2FM%2F8cb12819-3172-4646-9107-e7255852254e/watermark:F/width:1254?csig=AAAAAAAAAAAAAAAAAAAAAGX34HE16ht0ipUk2NMHHs83H4yu-0kCS8mAfuHWlCT0&exp=1794665951&osig=AAAAAAAAAAAAAAAAAAAAAO3ZPvBhYruOjjuT3kcYl4564uJeBEsvEdsP0oCVDMzM&signer=media-rpc&token=AAIAAU0AJDhjYjEyODE5LTMxNzItNDY0Ni05MTA3LWU3MjU1ODUyMjU0ZQAAAAABodptLxjKT1q6kqsv4IseHvr2STZCJqxXOWPXAqXEGWfzqbooUw&x-canva-quality=original" -o transfer/service-resized1254.png; then file transfer/service-resized1254.png; du -h transfer/service-resized1254.png; else echo "FAILED service resized1254"; fi
          echo "Testing about original"
          if curl -fLsS --retry 1 --max-time 30 "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Feef9e8c8-75a6-490a-8a00-ef6ed3bbcb78/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMgehOyWb0wKHxCW4iZSo10CP2-2eGj6pfbjO9JJi-eu&exp=1794668284&osig=AAAAAAAAAAAAAAAAAAAAAJzIR-XHR2sbJQ_Gw-UK2AKl4OK5UJecTRl0UGH0vogP&signer=media-rpc&token=AAIAAU0AJGVlZjllOGM4LTc1YTYtNDkwYS04YTAwLWVmNmVkM2JiY2I3OAAAAAABodqQyGAeskUkuvi9IER6QFoC-HzrA4uKW9_9c1udZBQdimeA9w&x-canva-quality=thumbnail" -o transfer/about-original.png; then file transfer/about-original.png; du -h transfer/about-original.png; else echo "FAILED about original"; fi
          echo "Testing about resized1254"
          if curl -fLsS --retry 1 --max-time 30 "https://media.canva.com/v2/image-resize/format:PNG/height:1254/quality:100/uri:ifs%3A%2F%2FM%2Feef9e8c8-75a6-490a-8a00-ef6ed3bbcb78/watermark:F/width:1254?csig=AAAAAAAAAAAAAAAAAAAAAMgehOyWb0wKHxCW4iZSo10CP2-2eGj6pfbjO9JJi-eu&exp=1794668284&osig=AAAAAAAAAAAAAAAAAAAAAJzIR-XHR2sbJQ_Gw-UK2AKl4OK5UJecTRl0UGH0vogP&signer=media-rpc&token=AAIAAU0AJGVlZjllOGM4LTc1YTYtNDkwYS04YTAwLWVmNmVkM2JiY2I3OAAAAAABodqQyGAeskUkuvi9IER6QFoC-HzrA4uKW9_9c1udZBQdimeA9w&x-canva-quality=original" -o transfer/about-resized1254.png; then file transfer/about-resized1254.png; du -h transfer/about-resized1254.png; else echo "FAILED about resized1254"; fi
